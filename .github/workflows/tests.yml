name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    # Same-repo PRs already run via `push` on the head branch; skip the extra
    # pull_request job. Fork PRs only get pull_request, so those still run.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portal_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portal_e2e
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/portal_e2e
      AUTH_SECRET: e2e-ci-secret-not-for-production
      AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: corepack enable

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - run: npm test --prefix edge-gateway

      - run: npx playwright install --with-deps chromium

      - run: npx prisma migrate deploy

      - run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - run: npm run build

      - run: npm run test:e2e

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Factory Vercel projects have git auto-deploy off (vercel.json). After CI
  # is green, POST each project's Deploy Hook. One URL per line in the secret.
  deploy:
    needs: run-tests
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hooks
        env:
          BRANCH: ${{ github.ref_name }}
          HOOKS_PRODUCTION: ${{ secrets.VERCEL_DEPLOY_HOOKS_PRODUCTION }}
          HOOKS_STAGING: ${{ secrets.VERCEL_DEPLOY_HOOKS_STAGING }}
        run: |
          if [ "${BRANCH}" = "main" ]; then
            HOOKS="${HOOKS_PRODUCTION}"
            SECRET_NAME=VERCEL_DEPLOY_HOOKS_PRODUCTION
          else
            HOOKS="${HOOKS_STAGING}"
            SECRET_NAME=VERCEL_DEPLOY_HOOKS_STAGING
          fi
          if [ -z "${HOOKS}" ]; then
            echo "::warning::No Vercel deploy hooks in secret ${SECRET_NAME}. Add one URL per factory project (Settings → Git → Deploy Hooks). See README Deploy."
            exit 0
          fi
          while IFS= read -r hook || [ -n "${hook}" ]; do
            hook="${hook%%$'\r'}"
            [ -z "${hook}" ] && continue
            curl -fsS -X POST "${hook}" >/dev/null
            echo "Triggered a Vercel deploy hook."
          done <<< "${HOOKS}"
